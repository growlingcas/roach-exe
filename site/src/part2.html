<style>
/* ===== TRADE (pro terminal) ===== */
#view-trade{background:var(--void)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 300px 330px;grid-template-rows:auto minmax(480px,1fr) auto;gap:1px;background:var(--line);
  height:calc(100vh - var(--nav-h) - env(safe-area-inset-top,0px));min-height:760px;font-size:12.5px}
.tr>*{background:var(--stone);min-width:0}
.pane-h{overflow-x:auto;scrollbar-width:none;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;height:38px;flex:none}
.ptab{white-space:nowrap;flex:none;background:none;border:0;border-bottom:1px solid transparent;height:38px;padding:0 10px;color:var(--ash);font-size:12.5px}
.ptab[aria-selected="true"]{color:var(--marble);border-bottom-color:var(--bone)}
.mbar{grid-column:1/-1;display:flex;align-items:center;gap:26px;padding:0 16px;height:60px;overflow-x:auto;scrollbar-width:none}
.mbar::-webkit-scrollbar{display:none}
.sym-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 8px 6px 0;flex:none}
.sym-btn .glyph{width:30px;height:30px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-carve);font-size:11px}
.sym-btn b{font-size:17px;font-weight:600;letter-spacing:.01em}
.sym-btn small{display:block;color:var(--ash);font-size:11px;text-align:left}
.sym-btn .chev{width:10px;height:10px;border-right:1px solid var(--dust);border-bottom:1px solid var(--dust);transform:rotate(45deg) translateY(-3px);margin-left:4px}
.mstat{display:grid;gap:1px;flex:none}
.mstat small{color:var(--ash);font-size:11px;white-space:nowrap}
.mstat span{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.mprice{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums;flex:none;min-width:110px}
.chart-pane{display:flex;flex-direction:column;position:relative}
.tf{display:flex;gap:0;align-items:center}
.tf button{background:none;border:0;color:var(--ash);padding:4px 9px;font-family:var(--f-num);font-size:12px}
.tf button[aria-pressed="true"]{color:var(--marble);background:var(--slab2)}
.tf .sep{width:1px;height:16px;background:var(--line);margin:0 8px}
.chart-box{position:relative;flex:1;min-height:300px}
.chart-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.chart-legend{position:absolute;left:12px;top:8px;font-family:var(--f-num);font-size:11.5px;color:var(--ash);pointer-events:none;display:flex;gap:12px;flex-wrap:wrap;z-index:2}
.chart-legend b{color:var(--dust);font-weight:500}
.chart-wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(60px,9vw,140px);color:rgba(235,231,222,.035);letter-spacing:.1em;font-weight:500}
.feedtag{margin-left:auto;white-space:nowrap;flex:none}

/* order book */
.book{display:flex;flex-direction:column}
.book-cols{display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 12px;color:var(--ash);font-size:11px}
.book-cols span:not(:first-child){text-align:right}
.ob-side{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.ob-side.asks{justify-content:flex-end}
.ob-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 12px;height:21px;align-items:center;position:relative;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;cursor:pointer}
.ob-row:hover{background:var(--slab2)}
.ob-row span:not(:first-child){text-align:right;color:var(--dust)}
.ob-row i{position:absolute;right:0;top:1px;bottom:1px;z-index:0;transition:width .3s}
.ob-row span{position:relative;z-index:1}
.asks .ob-row i{background:var(--down-bg)}.bids .ob-row i{background:var(--up-bg)}
.asks .ob-row span:first-child{color:var(--down)}.bids .ob-row span:first-child{color:var(--up)}
.spread{display:flex;align-items:center;gap:12px;padding:8px 12px;border-block:1px solid var(--line);font-family:var(--f-num)}
.spread b{font-size:16px;font-weight:500}
.spread small{color:var(--ash);margin-left:auto;font-size:11px}
.grp{margin-left:auto;background:var(--slab);border:1px solid var(--line);padding:3px 6px;font-family:var(--f-num);font-size:11px}
.trades-list{flex:1;overflow:hidden}
.trades-list .ob-row{cursor:default}
.trades-list .ob-row span:last-child{color:var(--ash)}

/* order form */
.oform{display:flex;flex-direction:column;overflow-y:auto}
.of-in{padding:12px 14px;display:grid;gap:12px}
.of-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.of-top button{background:var(--slab);border:1px solid var(--line);padding:8px;font-size:12.5px;color:var(--bone)}
.of-type{display:flex;gap:16px;border-bottom:1px solid var(--line)}
.of-type button{background:none;border:0;padding:8px 0;color:var(--ash);border-bottom:1px solid transparent;font-size:12.5px}
.of-type button[aria-selected="true"]{color:var(--marble);border-bottom-color:var(--bone)}
.side{display:grid;grid-template-columns:1fr 1fr;background:var(--slab);border:1px solid var(--line);padding:2px}
.side button{background:none;border:0;padding:8px;color:var(--ash);font-weight:500}
.side button.on.buy{background:var(--up);color:#06150d}
.side button.on.sell{background:var(--down);color:#1a0606}
.avail{display:flex;justify-content:space-between;color:var(--ash);font-size:12px}
.avail span{font-family:var(--f-num);color:var(--dust)}
.inp{display:flex;align-items:center;background:var(--slab);border:1px solid var(--line);height:40px;padding:0 10px;gap:8px}
.inp:focus-within{border-color:var(--dust)}
.inp label{color:var(--ash);font-size:12px;flex:none}
.inp input{flex:1;min-width:0;background:none;border:0;outline:none;text-align:right;font-family:var(--f-num);font-size:13px}
.inp .u{color:var(--dust);font-size:12px;flex:none}
.inp .mid{background:none;border:0;color:var(--dust);font-size:11px;padding:2px 4px;border:1px solid var(--line2)}
.pct{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pct button{background:var(--slab);border:1px solid var(--line);font-family:var(--f-num);font-size:11px;padding:5px 0;color:var(--ash)}
.pct button:hover{color:var(--marble);border-color:var(--line2)}
input[type=range].lev{width:100%;accent-color:var(--bone)}
.chk{display:flex;gap:16px;flex-wrap:wrap;color:var(--dust);font-size:12px}
.chk label{display:flex;gap:6px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--bone)}
.place{width:100%;border:0;padding:13px;font-weight:600;font-size:14px;letter-spacing:.02em}
.place.buy{background:var(--up);color:#06150d}.place.sell{background:var(--down);color:#1a0606}
.summ{display:grid;gap:6px;font-size:12px;color:var(--ash)}
.summ div{display:flex;justify-content:space-between}
.summ span{font-family:var(--f-num);color:var(--dust)}
.lev-pop{display:grid;gap:8px;padding:10px;border:1px solid var(--line2);background:var(--slab)}
.lev-pop .row{display:flex;justify-content:space-between;align-items:center}

.bottom{grid-column:1/3;min-height:220px;display:flex;flex-direction:column}
.empty{flex:1;display:grid;place-items:center;color:var(--ash);padding:30px;text-align:center}
.empty svg{width:30px;height:20px;opacity:.4;margin:0 auto 10px;display:block}
.acct{display:flex;flex-direction:column}
.acct .of-in{gap:10px}
.acct .summ{font-size:12.5px}
.acct .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acct .btns button{background:var(--slab);border:1px solid var(--line);padding:9px;font-size:12.5px}
.acct .btns button:hover{border-color:var(--dust)}
.offer-card{border:1px solid var(--line2);padding:12px;display:grid;gap:4px;background:linear-gradient(135deg,var(--slab2),var(--stone))}
.offer-card b{font-family:var(--f-display);font-size:28px;font-weight:500;line-height:1}
.offer-card small{color:var(--ash)}
.offer-card a{color:var(--marble);font-size:12px}

/* market picker */
.picker{position:fixed;z-index:110;width:min(560px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 140px));display:flex;flex-direction:column;background:var(--stone);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.7)}
.pk-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pk-search input{flex:1;background:var(--slab);border:1px solid var(--line);padding:9px 10px;outline:none;font-size:13px}
.pk-search input:focus{border-color:var(--dust)}
.pk-tabs{display:flex;gap:2px;padding:8px 12px 0;flex-wrap:wrap}
.pk-sub{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pk-sub button{background:none;border:1px solid var(--line);padding:3px 10px;font-size:11.5px;color:var(--ash)}
.pk-sub button[aria-pressed="true"]{color:var(--marble);border-color:var(--dust)}
.pk-list{overflow-y:auto;flex:1}
.pk-head,.pk-row{display:grid;grid-template-columns:26px minmax(0,1.6fr) 1fr 0.8fr;gap:8px;align-items:center;padding:0 12px}
.pk-head{color:var(--ash);font-size:11px;height:30px;position:sticky;top:0;background:var(--stone)}
.pk-head span:nth-child(n+3),.pk-row span:nth-child(n+3){text-align:right}
.pk-row{height:44px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:13px}
.pk-row:hover,.pk-row.sel{background:var(--slab2)}
.pk-row .star{background:none;border:0;color:var(--line2);font-size:14px;padding:0}
.pk-row .star.on{color:var(--bone)}
.pk-row .nm{display:flex;align-items:center;gap:10px;min-width:0}
.pk-row .nm small{color:var(--ash);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .cls{font-size:9.5px;letter-spacing:.1em;border:1px solid var(--line2);padding:1px 5px;color:var(--ash);text-transform:uppercase}
.pk-row span.num{font-size:12.5px}

.m-tabs{display:none}

/* ===== CARD ===== */
.card-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center;padding-block:clamp(56px,8vw,110px)}
.card-hero h1{font-family:var(--f-display);font-weight:300;font-size:clamp(64px,9vw,132px);line-height:.88;margin:18px 0 22px;color:var(--marble)}
.card-hero h1 em{font-style:italic}
.card-hero p{color:var(--dust);max-width:46ch;margin:0 0 28px;font-size:16px}
.cstage{perspective:1200px;display:grid;place-items:center;min-height:420px;position:relative}
.cstage::before{content:"";background-image:var(--bgimg);position:absolute;inset:-10% -20%;background-size:cover;background-position:center 30%;opacity:.22;filter:blur(1px) contrast(1.2);z-index:0;mask-image:radial-gradient(closest-side,#000,transparent)}
.pcard{position:relative;z-index:1;width:min(440px,88vw);aspect-ratio:1.586;border-radius:18px;transform-style:preserve-3d;transition:transform .2s ease-out;
  background:
    radial-gradient(120% 140% at 10% 0%,rgba(255,255,255,.14),transparent 55%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),
    linear-gradient(135deg,#1d1c1a,#090909 60%,#151413);
  border:1px solid rgba(235,231,222,.18);box-shadow:0 50px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);padding:6%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.13) 45%,transparent 60%);transform:translateX(var(--sh,-60%));pointer-events:none}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start}
.pc-top b{font-family:var(--f-carve);font-weight:600;letter-spacing:.34em;font-size:clamp(16px,2.4vw,20px)}
.pc-top small{font-family:var(--f-carve);font-size:9px;letter-spacing:.24em;color:var(--ash)}
.pc-chip{width:13%;aspect-ratio:1.3;border-radius:5px;background:linear-gradient(135deg,#cfcac0,#77736b);opacity:.85;position:relative}
.pc-chip::after{content:"";position:absolute;inset:22% 0;border-block:1px solid rgba(0,0,0,.35)}
.pc-num{font-family:var(--f-num);font-size:clamp(14px,2.4vw,19px);letter-spacing:.14em;color:var(--dust)}
.pc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.pc-bot small{display:block;font-size:9px;letter-spacing:.2em;color:var(--ash);font-family:var(--f-carve)}
.pc-bot span{font-family:var(--f-num);font-size:13px}
.pc-mark{width:22px;height:42px;opacity:.9}
.req{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.req>div{background:var(--stone);padding:26px;display:grid;gap:10px;align-content:start}
.req .n{font-family:var(--f-display);font-size:34px;color:var(--ash);line-height:1}
.req h3{margin:0;font-family:var(--f-carve);font-weight:400;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.req p{margin:0;color:var(--dust);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);padding:4px 9px;color:var(--ash);justify-self:start}
.pill.ok{color:var(--up);border-color:rgba(143,209,173,.4)}
.pill.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--up)}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);margin-top:70px}
.feat h4{margin:0 0 8px;font-family:var(--f-display);font-weight:500;font-size:28px;color:var(--marble)}
.feat p{margin:0;color:var(--dust);font-size:14.5px}
.feat .carve{color:var(--ash);display:block;margin-bottom:12px}
.notice{margin-top:56px;border:1px solid var(--line);padding:18px 20px;color:var(--ash);font-size:13px;display:flex;gap:14px;align-items:flex-start}

/* ===== responsive ===== */
@media (max-width:1180px){
  .tr{grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto minmax(440px,auto) auto auto;height:auto}
  .chart-pane{grid-column:1;grid-row:2}
  .oform{grid-column:2;grid-row:2/4}
  .book{grid-column:1;grid-row:3;max-height:520px}
  .bottom{grid-column:1/3;grid-row:4}
  .acct{grid-column:1/3;grid-row:5}
}
@media (max-width:860px){
  .nav-links{display:none;position:absolute;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;background:var(--stone);border-bottom:1px solid var(--line);padding:8px 16px 16px}
  .nav-links.open{display:flex}
  .nav-links a{padding:14px 4px;border:0;border-bottom:1px solid var(--line)}
  .burger{display:block}
  .nav-in{gap:12px}
  .nav-x .btn{padding:9px 12px;font-size:10px}
  .x-pill.on{display:none}
  .off-grid{grid-template-columns:1fr}
  .off-img{position:relative;top:0;aspect-ratio:16/10}
  .off-img figcaption{bottom:-28px}
  .paths{grid-template-columns:1fr}
  .path+.path{border-left:0;border-top:1px solid var(--line)}
  .t-img{width:58vw}.t-img.wide{width:78vw}
  .card-hero{grid-template-columns:1fr}
  .cstage{min-height:300px}
  .req,.feat{grid-template-columns:1fr}
  .tr{grid-template-columns:minmax(0,1fr);grid-template-rows:none;gap:1px}
  .t-hud-r{display:none}
  .hero::after{background:linear-gradient(0deg,var(--void) 8%,rgba(7,7,7,.82) 55%,rgba(7,7,7,.35) 100%)}
  .mbar{grid-column:1}
  .m-tabs{display:flex;grid-column:1}
  .chart-pane,.book,.oform,.bottom,.acct,.mbar,.m-tabs{grid-column:1!important;grid-row:auto!important}
  .tr[data-mt="chart"] .book{display:none}
  .tr[data-mt="book"] .chart-pane{display:none}
  .chart-pane{min-height:420px}
  .book{grid-row:auto;max-height:none;min-height:520px}
  .oform{grid-column:1;grid-row:auto}
  .bottom,.acct{grid-column:1}
  .mbar .mstat.hide-m{display:none}
}
@media (max-width:520px){
  .hero-grid{padding-bottom:84px}
  .dest{grid-template-columns:1fr}
  .br{grid-template-columns:86px minmax(0,1fr) 58px}
  .step{grid-template-columns:44px minmax(0,1fr)}
  .step-n{font-size:22px}
  .field{flex-wrap:wrap}
  .field .btn{flex-basis:100%;border-left:0}
  .t-hud .carve:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .grain{display:none}
}
</style>
