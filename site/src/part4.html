function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}return h>>>0}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const R=rng(Date.now()%100000+7);
function gauss(r=R){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
async function fetchT(url,opt={},ms=6000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw new Error(r.status);return r}finally{clearTimeout(t)}}

const S={};const subs=new Set();
MARKETS.forEach(m=>{const r=rng(fnv(m.s));const o=m.p*(1+(r()-.5)*.05);S[m.s]={px:m.p,prev:m.p,o,h:Math.max(o,m.p)*(1+r()*.012),l:Math.min(o,m.p)*(1-r()*.012),src:'sim'}});
function setPx(sym,px,src,extra){const st=S[sym];if(!isFinite(px)||px<=0)return;st.prev=st.px;st.px=px;st.src=src;if(extra){Object.assign(st,extra)}else{st.h=Math.max(st.h,px);st.l=Math.min(st.l,px)}subs.forEach(f=>f(sym))}

function startBinance(){
  const list=MARKETS.filter(m=>m.bn);if(!list.length||!('WebSocket' in window))return;
  let ws;try{ws=new WebSocket('wss://stream.binance.com:9443/stream?streams='+list.map(m=>m.bn.toLowerCase()+'@miniTicker').join('/'))}catch(e){return}
  const map={};list.forEach(m=>map[m.bn]=m.s);
  ws.onmessage=e=>{try{const d=JSON.parse(e.data).data;const s=map[d.s];if(!s)return;setPx(s,+d.c,'binance',{o:+d.o,h:+d.h,l:+d.l})}catch(err){}};
  ws.onclose=()=>{list.forEach(m=>{if(S[m.s].src==='binance')S[m.s].src='sim'});setTimeout(startBinance,15000)};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
}
const PYID={};

    const arr=await r.json();const hit=arr.find(f=>(f.attributes?.symbol||'').toUpperCase()===m.py.toUpperCase());
    if(hit){PYID[m.s]=hit.id;loadPrevClose(m)}
  }catch(e){}}));
  const ids=Object.entries(PYID);if(!ids.length)return;
  const poll=async()=>{try{
    const r=await fetchT('https://hermes.pyth.network/v2/updates/price/latest?parsed=true&'+ids.map(([,id])=>'ids[]='+id).join('&'));
    const j=await r.json();(j.parsed||[]).forEach(p=>{const e=ids.find(([,id])=>id.replace(/^0x/,'')===p.id.replace(/^0x/,''));if(!e)return;setPx(e[0],+p.price.price*Math.pow(10,p.price.expo),'pyth')});
  }catch(e){}};

}
async function loadPrevClose(m){try{const now=Math.floor(Date.now()/1000);const r=await fetchT(`https://benchmarks.pyth.network/v1/shims/tradingview/history?symbol=${encodeURIComponent(m.py)}&resolution=1D&from=${now-86400*6}&to=${now}`);const j=await r.json();if(j.s==='ok'&&j.c.length>1){const st=S[m.s];st.o=j.c[j.c.length-2];st.h=j.h[j.h.length-1];st.l=j.l[j.l.length-1]}}catch(e){}}

/* ---------- CANDLES ---------- */
const TF={'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400};
const PYRES={'1m':'1','5m':'5','15m':'15','1h':'60','4h':'240','1d':'1D'};
const SYN={};
function synthBase(m,sec,n){const r=rng(fnv(m.s+'base'+sec)),now=Math.floor(Date.now()/1000/sec)*sec;let p=1;const out=[];const v=m.vol*Math.sqrt(sec)*0.9;let drift=0;
  for(let i=0;i<n;i++){if(i%160===0)drift=(r()-.5)*v*0.25;const o=p;const c=o*Math.exp(v*gauss(r)+drift);const h=Math.max(o,c)*(1+Math.abs(gauss(r))*v*0.45),l=Math.min(o,c)*(1-Math.abs(gauss(r))*v*0.45);out.push({t:now-(n-1-i)*sec,o,h,l,c,v:Math.exp(gauss(r)*0.6)*(1+Math.abs(c/o-1)*60)});p=c}
  const k=S[m.s].px/p;out.forEach(b=>{b.o*=k;b.h*=k;b.l*=k;b.c*=k});return out}
function synth(m,tf){const sec=TF[tf];
  if(sec>=900){const key=m.s;if(!SYN[key])SYN[key]=synthBase(m,900,220*96);const base=SYN[key];const k=sec/900,out=[];const last=base[base.length-1];const k2=S[m.s].px/last.c;
    for(let i=0;i<base.length;i++){const b=base[i],bt=Math.floor(b.t/sec)*sec,o=out[out.length-1];if(o&&o.t===bt){o.h=Math.max(o.h,b.h*k2);o.l=Math.min(o.l,b.l*k2);o.c=b.c*k2;o.v+=b.v}else out.push({t:bt,o:b.o*k2,h:b.h*k2,l:b.l*k2,c:b.c*k2,v:b.v})}
    return{data:out.slice(-Math.max(400,Math.min(out.length,1000))).map(b=>({...b})),src:'sim'}}
  const base=SYN[m.s]||(SYN[m.s]=synthBase(m,900,220*96));const anchor=base[base.length-1];
  return{data:synthBase(m,sec,400),src:'sim'}}
async function loadCandles(m,tf){
  if(m.bn){try{const r=await fetchT(`https://data-api.binance.vision/api/v3/klines?symbol=${m.bn}&interval=${tf}&limit=400`,{},5000);const j=await r.json();if(Array.isArray(j)&&j.length)return{data:j.map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})),src:'binance'}}catch(e){}}
  if(m.py){try{const now=Math.floor(Date.now()/1000);const r=await fetchT(`https://benchmarks.pyth.network/v1/shims/tradingview/history?symbol=${encodeURIComponent(m.py)}&resolution=${PYRES[tf]}&from=${now-TF[tf]*400}&to=${now}`,{},5000);const j=await r.json();if(j.s==='ok'&&j.t.length>5)return{data:j.t.map((t,i)=>({t,o:j.o[i],h:j.h[i],l:j.l[i],c:j.c[i],v:j.v?j.v[i]:0})),src:'pyth'}}catch(e){}}
  return synth(m,tf);
}

MARKETS.forEach(m=>{const st=S[m.s];if(st.src!=='sim')return;const d=synth(m,'15m').data.slice(-96);st.o=d[0].o;st.h=Math.max(...d.map(b=>b.h));st.l=Math.min(...d.map(b=>b.l))});
/* ---------- CHART (TradingView-style canvas engine) ---------- */
const IND_COL={ma20:'#c9b27c',ema50:'#7fa6c9',ema200:'#b58fc9',bb:'#a29d92',vwap:'#d69a5c'};
const IND_NAME={ma20:'MA 20',ema50:'EMA 50',ema200:'EMA 200',bb:'BB 20 2',vwap:'VWAP',rsi:'RSI 14',macd:'MACD 12 26 9',vol:'Volume'};
function sma(a,n){const o=new Array(a.length).fill(null);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n}return o}
function ema(a,n){const o=new Array(a.length).fill(null);if(a.length<n)return o;const k=2/(n+1);let e=0;for(let j=0;j<n;j++)e+=a[j];e/=n;o[n-1]=e;for(let i=n;i<a.length;i++){e=a[i]*k+e*(1-k);o[i]=e}return o}
function boll(a,n=20,m=2){const mid=sma(a,n),up=[],lo=[];for(let i=0;i<a.length;i++){if(mid[i]==null){up.push(null);lo.push(null);continue}let s=0;for(let j=i-n+1;j<=i;j++)s+=(a[j]-mid[i])**2;const sd=Math.sqrt(s/n);up.push(mid[i]+m*sd);lo.push(mid[i]-m*sd)}return{mid,up,lo}}
function rsiCalc(c,n=14){const o=new Array(c.length).fill(null);if(c.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];if(d>0)g+=d;else l-=d}g/=n;l/=n;o[n]=l===0?100:100-100/(1+g/l);for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l===0?100:100-100/(1+g/l)}return o}
function macdCalc(c){const f=ema(c,12),s=ema(c,26);const m=c.map((_,i)=>f[i]!=null&&s[i]!=null?f[i]-s[i]:null);const fi=m.findIndex(v=>v!=null);const sig=new Array(c.length).fill(null);if(fi>=0){ema(m.slice(fi),9).forEach((v,j)=>sig[fi+j]=v)}return{m,sig,h:m.map((v,i)=>v!=null&&sig[i]!=null?v-sig[i]:null)}}
function vwapCalc(d){const o=[];let day=-1,pv=0,v=0;for(const b of d){const dd=Math.floor(b.t/86400);if(dd!==day){day=dd;pv=0;v=0}const tp=(b.h+b.l+b.c)/3,vv=b.v||1;pv+=tp*vv;v+=vv;o.push(pv/v)}return o}
function heikin(d){const o=[];d.forEach((b,i)=>{const c=(b.o+b.h+b.l+b.c)/4;const op=i?(o[i-1].o+o[i-1].c)/2:(b.o+b.c)/2;o.push({t:b.t,o:op,c,h:Math.max(b.h,op,c),l:Math.min(b.l,op,c),v:b.v})});return o}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
const FIBS=[0,0.236,0.382,0.5,0.618,0.786,1];

class Chart{
  constructor(box,legend,onTool){
    this.box=box;this.cv=box.querySelector('canvas');this.ctx=this.cv.getContext('2d');this.lg=legend;this.onTool=onTool||(()=>{});
    this.data=[];this.dp=2;this.tf='15m';this.sym='BTC';this.pair='BTC-USD';
    const sv=LS.get('pray.chart.v2')||{};
    this.type=sv.type||'candles';this.log=!!sv.log;
    this.ind=Object.assign({vol:true,ma20:false,ema50:false,ema200:false,bb:false,vwap:false,rsi:false,macd:false},sv.ind||{});
    this.tool='cross';this.magnet=false;this.draws=LS.get('pray.draws')||{};this.tmp=null;this.meas=null;this.sel=-1;
    this.reset(true);this.g=null;this.mx=null;this.my=null;this.ptrs=new Map();
    new ResizeObserver(()=>this.resize()).observe(box);
    const cv=this.cv;let act=null;
    const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
    cv.addEventListener('pointerdown',e=>{if(!this.g)return;cv.setPointerCapture(e.pointerId);const p=pos(e);this.ptrs.set(e.pointerId,p);
      if(this.ptrs.size===2){const[a,b]=[...this.ptrs.values()];act={k:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),bw0:this.bw,cx:(a.x+b.x)/2,i0:this.ix((a.x+b.x)/2)};this.tmp=null;return}
      const{x,y}=p,g=this.g;
      if(e.pointerType!=='mouse'){this.mx=x;this.my=y}
      if(x>g.PW&&y<g.H-g.AY){act={k:'py',y0:y,rng:this.vr()};return}
      if(y>g.H-g.AY){act={k:'px',x0:x,bw0:this.bw,i0:this.ix(g.PW)};return}
      if(y>g.MB){act={k:'pan',x0:x,y0:y,ro0:this.ro,rng:null};return}
      const pt=this.pt(x,y);
      if(this.tool==='hline'){this.list.push({type:'h',p:pt.p});this.commit();return}
      if(this.tool==='vline'){this.list.push({type:'v',t:pt.t});this.commit();return}
      if(this.tool!=='cross'){
        if(this.tmp&&!this.tmp.drag){this.tmp.b=pt;this.finish();return}
        this.tmp={type:this.tool,a:pt,b:pt,drag:true,sx:x,sy:y};if(this.tool==='measure')this.meas=null;this.draw();return}
      const h=this.hit(x,y);
      if(h>=0){this.sel=h;act={k:'mv',x0:x,y0:y,orig:JSON.parse(JSON.stringify(this.list[h])),i0:this.ix(x),p0:this.py(y)};this.draw();return}
      this.sel=-1;this.meas=null;act={k:'pan',x0:x,y0:y,ro0:this.ro,rng:this.auto?null:this.vr()};cv.style.cursor='grabbing';this.draw()});
    cv.addEventListener('pointermove',e=>{const p=pos(e);if(this.ptrs.has(e.pointerId))this.ptrs.set(e.pointerId,p);const{x,y}=p;this.mx=x;this.my=y;const g=this.g;if(!g)return;
      if(act){
        if(act.k==='pinch'&&this.ptrs.size===2){const[a,b]=[...this.ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);this.zoomAt(act.cx,act.bw0*d/act.d0,act.i0)}
        else if(act.k==='pan'){this.ro=act.ro0+(x-act.x0)/this.bw;this.clampRo();if(act.rng){const dy=(y-act.y0)/(g.PB-g.TOP)*(act.rng[1]-act.rng[0]);this.man=[act.rng[0]+dy,act.rng[1]+dy]}}
        else if(act.k==='py'){const k=Math.exp((y-act.y0)/160),c=(act.rng[0]+act.rng[1])/2,h=(act.rng[1]-act.rng[0])/2*k;this.auto=false;this.man=[c-h,c+h];this.syncAuto()}
        else if(act.k==='px'){this.zoomAt(g.PW,act.bw0*Math.exp(-(x-act.x0)/160),act.i0)}
        else if(act.k==='mv'){const d=this.list[this.sel],o=act.orig,di=this.ix(x)-act.i0,dp=this.py(y)-act.p0;
          const sh=q=>q&&({t:this.iToT(this.tToI(q.t)+di),p:q.p+dp});if(d.type==='h')d.p=o.p+dp;else if(d.type==='v')d.t=this.iToT(this.tToI(o.t)+di);else{d.a=sh(o.a);d.b=sh(o.b)}}}
      if(this.tmp)this.tmp.b=this.pt(x,y);
      if(!act)cv.style.cursor=x>g.PW&&y<g.H-g.AY?'ns-resize':y>g.H-g.AY?'ew-resize':(this.tool==='cross'&&this.hit(x,y)>=0?'move':'crosshair');
      this.req()});
    const up=e=>{const p=pos(e);this.ptrs.delete(e.pointerId);if(act&&act.k==='mv')this.save();
      if(act&&act.k==='pinch'){act=null;return}act=null;cv.style.cursor='crosshair';
      if(this.tmp&&this.tmp.drag){if(Math.hypot(p.x-this.tmp.sx,p.y-this.tmp.sy)<5)this.tmp.drag=false;else this.finish()}
      if(e.pointerType!=='mouse'&&!this.tmp){this.mx=null;this.my=null}this.req()};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!act){this.mx=null;this.my=null;this.req()}});
    cv.addEventListener('wheel',e=>{e.preventDefault();if(!this.g)return;const{x}=pos(e);
      if(Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey){this.ro+=(e.deltaX||e.deltaY)/this.bw;this.clampRo()}
      else{const k=Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0022));this.zoomAt(x<this.g.PW?x:this.g.PW,this.bw*k)}this.req()},{passive:false});
    cv.addEventListener('dblclick',e=>{const{x,y}=pos(e);if(this.g&&x>this.g.PW){this.auto=true;this.syncAuto()}else if(this.g&&y>this.g.H-this.g.AY)this.reset();this.req()});
  }
  /* ---- view model ---- */
  reset(silent){this.bw=8;this.ro=6;this.auto=true;this.man=null;if(!silent){this.syncAuto();this.req()}}
  syncAuto(){const b=document.getElementById('autoBtn');if(b)b.setAttribute('aria-pressed',this.auto)}
  setAuto(){this.auto=true;this.man=null;this.syncAuto();this.req()}
  minBw(){const n=this.data.length||1,PW=this.g?this.g.PW:600;return clamp(PW/(n+12),0.6,6)}
  clampRo(){const n=this.data.length,PW=this.g?this.g.PW:600,vis=PW/this.bw;this.ro=clamp(this.ro,-(n-8),Math.max(8,vis-8))}

function paintCards(){const x=ST.x,se=ST.sealed;$$('.vcard').forEach(c=>{c.querySelector('.vc-name').textContent=x?'@'+x.toUpperCase():'@YOUR_HANDLE';c.querySelector('.vc-l4').textContent=x?String(fnv('card'+x)%10000).padStart(4,'0'):'••••';c.querySelector('.vc-bal').textContent='$0.00'})}
function renderCard(){const x=ST.x,se=ST.sealed;paintCards();
  const set=(id,ok,a,b)=>{const p=$(id);p.textContent=ok?a:b;p.classList.toggle('ok',ok)};
  set('#rq1',!!x,'@'+x,'Not connected');set('#rq2',!!se,'Created','Not created');set('#rq3',!!ST.card,'Reserved','Not reserved');
  const b=$('#reserveCard');b.textContent=ST.card?'Card reserved':'Reserve my card';b.disabled=!!ST.card;$('#cardOfferBtn').hidden=!!se}
$('#reserveCard').onclick=()=>{if(!ST.x){toast('Enter your X username first.');go('claim');return}
  if(!ST.sealed){toast('Claim your offering first. That creates your PRAY account.');go('claim');return}
  ST.card=true;save();renderCard();openModal({k:'Card reserved',t:'Your place is held',p:`@${ST.x}, your PRAY Card in the ${CARD_DESIGNS.find(d=>d.k===curDesign()).n} design is reserved. Card issuing is coming soon; you will be asked to verify your identity with the issuer before your card ships.`,cta:'Open the terminal',href:'#trade'})};

renderOffer();route();
})();
</script>
